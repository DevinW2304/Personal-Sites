<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Devin Washington | Portfolio Intro</title>
  <link rel="stylesheet" href="css/intro.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="index.html">Skip intro and go to portfolio</a>

  <main class="intro-viewport">
    <!-- Parallax layers -->
    <div class="parallax-layer layer-back" data-depth="0.05" aria-hidden="true"></div>
    <div class="parallax-layer layer-grid" data-depth="0.12" aria-hidden="true"></div>

    <div class="parallax-layer layer-cards" data-depth="0.22" aria-hidden="true">
      <div class="device-card device-left">
        <div class="device-screen">
          <div class="chip-row">
            <span class="chip">Plant care</span>
            <span class="chip">AI</span>
          </div>
          <div class="screen-block screen-block-large"></div>
          <div class="screen-block-row">
            <div class="screen-block small"></div>
            <div class="screen-block small"></div>
          </div>
        </div>
      </div>

      <div class="device-card device-right">
        <div class="device-screen">
          <div class="screen-icon"></div>
          <div class="screen-title-bar"></div>
          <div class="screen-block screen-block-list"></div>
        </div>
      </div>
    </div>

    <!-- Foreground content -->
    <div class="parallax-layer layer-foreground" data-depth="0">
      <section class="intro-content" aria-labelledby="intro-title">
        <p class="eyebrow">HCI · Android · AI</p>
        <h1 id="intro-title">Devin Washington</h1>
        <p class="subtitle">
          I design and build human-centered interfaces that make complex systems feel intuitive.
        </p>
        <div class="button-row">
          <a href="index.html" class="btn btn-primary">
            Enter Portfolio
          </a>
          <button class="btn btn-ghost" type="button" id="toggle-motion">
            Toggle motion
          </button>
        </div>
        <p class="meta">
          Scroll or move your cursor to explore the intro.  
          Motion respects system “reduce motion” preferences.
        </p>
      </section>
    </div>
  </main>

  <script src="js/intro.js"></script>
</body>
</html>
